const appState = {
  currentView: 'welcome',
  activeTab: 'chat',
  currentUser: null,
  room: null,
  avatarChoice: '🌙'
};

const avatarList = ['🌙', '🦊', '🐻', '🚀', '🧚', '😹', '🍓', '🌸', '🍕', '🧁'];

const els = {
  welcomeView: document.getElementById('welcomeView'),
  roomView: document.getElementById('roomView'),
  createPanel: document.getElementById('createPanel'),
  joinPanel: document.getElementById('joinPanel'),
  createForm: document.getElementById('createForm'),
  joinForm: document.getElementById('joinForm'),
  formNotice: document.getElementById('formNotice'),
  openCreate: document.getElementById('openCreate'),
  openJoin: document.getElementById('openJoin'),
  roomTitle: document.getElementById('roomTitle'),
  roomCodeDisplay: document.getElementById('roomCodeDisplay'),
  roomBadge: document.getElementById('roomBadge'),
  copyRoomCode: document.getElementById('copyRoomCode'),
  tabButtons: document.querySelectorAll('.nav-item'),
  tabPanels: document.querySelectorAll('.tab-panel'),
  chatList: document.getElementById('chatList'),
  chatInput: document.getElementById('chatInput'),
  messageForm: document.getElementById('messageForm'),
  quizArea: document.getElementById('quizArea'),
  pollArea: document.getElementById('pollArea'),
  gameArea: document.getElementById('gameArea'),
  midnightArea: document.getElementById('midnightArea'),
  leaderboardArea: document.getElementById('leaderboardArea'),
  membersArea: document.getElementById('membersArea'),
  profileArea: document.getElementById('profileArea'),
  settingsArea: document.getElementById('settingsArea')
};

function setView(view) {
  appState.currentView = view;
  els.welcomeView.classList.toggle('hidden', view !== 'welcome');
  els.roomView.classList.toggle('hidden', view !== 'room');
}

function setNotice(message, type = 'error') {
  if (!message) {
    els.formNotice.classList.add('hidden');
    els.formNotice.textContent = '';
    return;
  }
  els.formNotice.textContent = message;
  els.formNotice.classList.remove('hidden');
  els.formNotice.style.background = type === 'success' ? 'rgba(139, 229, 200, 0.12)' : 'rgba(255, 158, 203, 0.12)';
  els.formNotice.style.borderColor = type === 'success' ? 'rgba(139, 229, 200, 0.22)' : 'rgba(255, 158, 203, 0.2)';
  els.formNotice.style.color = type === 'success' ? '#dffef3' : '#ffdff0';
}

function buildAvatarGrid(rootId) {
  const root = document.getElementById(rootId);
  root.innerHTML = '';
  avatarList.forEach((emoji) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'avatar-chip-option';
    btn.textContent = emoji;
    btn.dataset.avatar = emoji;
    btn.addEventListener('click', () => {
      appState.avatarChoice = emoji;
      document.querySelectorAll('.avatar-chip-option').forEach((item) => {
        item.classList.toggle('selected', item.dataset.avatar === emoji);
      });
    });
    if (emoji === '🌙') btn.classList.add('selected');
    root.appendChild(btn);
  });
}

function togglePanel(panelId) {
  els.createPanel.classList.toggle('hidden', panelId !== 'create');
  els.joinPanel.classList.toggle('hidden', panelId !== 'join');
}

els.openCreate.addEventListener('click', () => togglePanel('create'));
els.openJoin.addEventListener('click', () => togglePanel('join'));

buildAvatarGrid('createAvatarGrid');
buildAvatarGrid('joinAvatarGrid');

els.createForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const payload = {
    roomName: document.getElementById('createRoomName').value,
    displayName: document.getElementById('createDisplayName').value,
    avatar: appState.avatarChoice
  };

  try {
    const response = await fetch('/api/rooms/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.message || 'Could not create room.');

    appState.currentUser = {
      id: data.room.memberId,
      displayName: data.room.displayName,
      avatar: data.room.avatar
    };
    appState.room = {
      id: data.room.id,
      roomName: data.room.roomName,
      roomCode: data.room.roomCode,
      members: [{ id: data.room.memberId, displayName: data.room.displayName, avatar: data.room.avatar, points: 10, status: 'online', badges: ['✨ New Club Member'] }],
      messages: [{ id: 'welcome', senderId: data.room.memberId, displayName: data.room.displayName, avatar: data.room.avatar, message: 'Welcome! The room is ready ✨', timestamp: new Date().toISOString() }],
      polls: [],
      quizzes: [],
      games: [],
      midnight: { phase: 'night', round: 1, roles: [] }
    };

    setView('room');
    setNotice('Room created successfully ✨', 'success');
    renderRoom();
  } catch (error) {
    setNotice(error.message || 'Looks like the vibe got interrupted. Trying again...');
  }
});

els.joinForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const payload = {
    roomName: document.getElementById('joinRoomName').value,
    roomCode: document.getElementById('joinRoomCode').value,
    displayName: document.getElementById('joinDisplayName').value,
    avatar: appState.avatarChoice
  };

  try {
    const response = await fetch('/api/rooms/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.message || 'Could not join the room.')

    appState.currentUser = {
      id: data.room.memberId,
      displayName: data.room.displayName,
      avatar: data.room.avatar
    };
    appState.room = {
      id: data.room.id,
      roomName: data.room.roomName,
      roomCode: data.room.roomCode,
      members: [{ id: data.room.memberId, displayName: data.room.displayName, avatar: data.room.avatar, points: 10, status: 'online', badges: ['✨ First Visit'] }],
      messages: [{ id: 'welcome', senderId: data.room.memberId, displayName: data.room.displayName, avatar: data.room.avatar, message: 'Hi room! I just joined ✨', timestamp: new Date().toISOString() }],
      polls: [],
      quizzes: [],
      games: [],
      midnight: { phase: 'night', round: 1, roles: [] }
    };

    setView('room');
    setNotice('', 'success');
    renderRoom();
  } catch (error) {
    setNotice(error.message || 'Looks like the vibe got interrupted. Trying again...');
  }
});

async function loadRoom(roomId, memberId) {
  const response = await fetch(`/api/rooms/${roomId}?memberId=${memberId}`);
  const data = await response.json();
  if (!response.ok || !data.success) throw new Error(data.message || 'Unable to load room.');
  appState.room = data.room;
  appState.currentUser = data.member;
  renderRoom();
}

function renderRoom() {
  if (!appState.room || !appState.currentUser) return;

  els.roomTitle.textContent = appState.room.roomName;
  els.roomCodeDisplay.textContent = appState.room.roomCode;
  els.roomBadge.textContent = '🔒 PRIVATE ROOM';

  renderChat();
  renderQuizzes();
  renderPolls();
  renderGames();
  renderMidnight();
  renderLeaderboard();
  renderMembers();
  renderProfile();
  renderSettings();
}

function renderChat() {
  const room = appState.room;
  const currentUserId = appState.currentUser.id;
  const messages = room.messages || [];
  els.chatList.innerHTML = '';

  if (!messages.length) {
    els.chatList.innerHTML = '<div class="empty-state">It\'s quiet in here... someone say something 👀</div>';
    return;
  }

  messages.forEach((message) => {
    const bubble = document.createElement('div');
    const isSelf = message.senderId === currentUserId;
    bubble.className = `message-bubble ${isSelf ? 'self' : ''}`;
    bubble.innerHTML = `
      <div class="avatar-mini">${message.avatar || '✨'}</div>
      <div>
        <div class="message-meta">
          <span class="message-author">${message.displayName}</span>
          <span class="message-time">${new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
        </div>
        <div class="message-text">${message.message}</div>
        <div class="reactions"><span>😍</span><span>✨</span></div>
      </div>
    `;
    els.chatList.appendChild(bubble);
  });

  els.chatList.scrollTop = els.chatList.scrollHeight;
}

function renderQuizzes() {
  const quizzes = appState.room.quizzes && appState.room.quizzes.length ? appState.room.quizzes : [{
    title: 'Moonlight Warmup',
    description: 'A little spark to get everyone going.',
    questions: [{ question: 'Which color is the room vibe most famous for?', options: ['Indigo', 'Red', 'Green', 'Orange'], correctIndex: 0, timer: 25, points: 10 }]
  }];

  els.quizArea.innerHTML = quizzes.map((quiz) => `
    <div class="card">
      <h4>${quiz.title}</h4>
      <p>${quiz.description || 'This room is buzzing.'}</p>
      <div class="badge-row">
        <span class="badge">🎯 ${quiz.questions.length} questions</span>
        <span class="badge">⚡ ${quiz.questions[0]?.timer || 25}s</span>
      </div>
      <div class="stat-row" style="margin-top:12px;"><span>Correct Answers</span><strong>8/10</strong></div>
      <div class="stat-row"><span>Points Earned</span><strong>+80</strong></div>
    </div>
  `).join('');
}

function renderPolls() {
  const polls = appState.room.polls && appState.room.polls.length ? appState.room.polls : [{
    question: 'What should we play today?',
    options: ['Mystery game', 'Quiz battle', 'Movie night', 'Cozy chat'],
    votes: [2, 5, 3, 2]
  }];

  els.pollArea.innerHTML = polls.map((poll) => `
    <div class="card">
      <h4>${poll.question}</h4>
      <div class="stat-list">
        ${poll.options.map((option, index) => `<div class="stat-row"><span>${option}</span><strong>${poll.votes?.[index] ?? 0}</strong></div>`).join('')}
      </div>
    </div>
  `).join('');
}

function renderGames() {
  const games = appState.room.games && appState.room.games.length ? appState.room.games : [
    { type: 'WHO SAID THAT?' },
    { type: 'MOST LIKELY TO' },
    { type: 'FRIEND TRIVIA' },
    { type: 'SPEED QUIZ' }
  ];

  els.gameArea.innerHTML = games.map((game) => `
    <div class="card">
      <h4>${game.type}</h4>
      <p>Private room challenge with points, mystery, and lots of energy.</p>
      <div class="badge-row"><span class="badge">🎮 Ready</span></div>
    </div>
  `).join('');
}

function renderMidnight() {
  const phase = appState.room.midnight?.phase || 'night';
  const round = appState.room.midnight?.round || 1;
  els.midnightArea.innerHTML = `
    <div class="midnight-scene">
      <div class="starfield"></div>
      <div class="moon"></div>
      <div class="midnight-panel">
        <h4>🌙 MIDNIGHT — Round ${round}</h4>
        <p>Phase: ${phase.toUpperCase()}</p>
        <div class="badge-row">
          <span class="badge">🔎 Detective</span>
          <span class="badge">🛡 Guardian</span>
          <span class="badge">🎭 Imposter</span>
          <span class="badge">👤 Citizen</span>
        </div>
      </div>
    </div>
  `;
}

function renderLeaderboard() {
  const members = appState.room.members || [];
  const sorted = [...members].sort((a, b) => (b.points || 0) - (a.points || 0));
  els.leaderboardArea.innerHTML = `
    <div class="card">
      <div class="stat-list">
        ${sorted.slice(0, 5).map((member, index) => `
          <div class="stat-row">
            <span>#${index + 1} ${member.displayName}</span>
            <strong>${member.points || 0} pts</strong>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderMembers() {
  const members = appState.room.members || [];
  els.membersArea.innerHTML = `
    <div class="member-list">
      ${members.map((member) => `
        <div class="member-item">
          <div class="member-left">
            <div class="avatar-mini">${member.avatar}</div>
            <div class="member-meta">
              <strong>${member.displayName}</strong>
              <span>${member.status || 'online'}</span>
            </div>
          </div>
          <div class="badge">${member.points || 0} pts</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderProfile() {
  const user = appState.currentUser || { displayName: 'Guest', avatar: '✨', points: 0 };
  els.profileArea.innerHTML = `
    <div class="card">
      <div class="member-left" style="margin-bottom:12px;">
        <div class="avatar-mini" style="width:62px;height:62px;font-size:2rem;">${user.avatar}</div>
        <div class="member-meta">
          <strong>${user.displayName}</strong>
          <span>Level 8 • Vibe Champion</span>
        </div>
      </div>
      <div class="stat-list">
        <div class="stat-row"><span>Total points</span><strong>${user.points || 240}</strong></div>
        <div class="stat-row"><span>Quiz stats</span><strong>8 wins</strong></div>
        <div class="stat-row"><span>Game stats</span><strong>12 nights</strong></div>
        <div class="stat-row"><span>Favorite game</span><strong>Midnight</strong></div>
      </div>
      <div class="badge-row">
        <span class="badge">🌟 Quiz Master</span>
        <span class="badge">🏆 Vibe Champion</span>
        <span class="badge">🎭 Mystery Master</span>
      </div>
    </div>
  `;
}

function renderSettings() {
  els.settingsArea.innerHTML = `
    <div class="card">
      <h4>Room settings</h4>
      <div class="stat-list">
        <div class="stat-row"><span>Room name</span><strong>${appState.room.roomName}</strong></div>
        <div class="stat-row"><span>Room code</span><strong>${appState.room.roomCode}</strong></div>
        <div class="stat-row"><span>Privacy</span><strong>Private</strong></div>
      </div>
    </div>
  `;
}

els.tabButtons.forEach((button) => {
  button.addEventListener('click', () => {
    appState.activeTab = button.dataset.tab;
    els.tabButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
    els.tabPanels.forEach((panel) => panel.classList.toggle('active', panel.dataset.panel === appState.activeTab));
  });
});

els.copyRoomCode.addEventListener('click', async () => {
  const value = appState.room?.roomCode || 'VX7K92';
  try {
    await navigator.clipboard.writeText(value);
    setNotice('Room code copied ✨', 'success');
  } catch {
    setNotice('Copy failed, but the code is still visible above.');
  }
});

els.messageForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const text = els.chatInput.value.trim();
  if (!text || !appState.room || !appState.currentUser) return;

  try {
    const response = await fetch(`/api/rooms/${appState.room.id}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ memberId: appState.currentUser.id, message: text })
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.message || 'Could not send');

    appState.room.messages.push({
      id: data.message.id,
      senderId: appState.currentUser.id,
      displayName: appState.currentUser.displayName,
      avatar: appState.currentUser.avatar,
      message: text,
      timestamp: new Date().toISOString()
    });

    els.chatInput.value = '';
    renderChat();
  } catch {
    appState.room.messages.push({
      id: `local-${Date.now()}`,
      senderId: appState.currentUser.id,
      displayName: appState.currentUser.displayName,
      avatar: appState.currentUser.avatar,
      message: text,
      timestamp: new Date().toISOString()
    });
    els.chatInput.value = '';
    renderChat();
  }
});

setView('welcome');
setNotice('');

