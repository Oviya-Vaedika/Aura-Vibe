function renderRoom(room, member) {
  const currentMember = member || room.members[0];
  refs.roomTitle.textContent = room.uniqueRoomName || room.roomName || appState.currentRoom;
  refs.roomCodeBlock.textContent = room.roomCode || 'VX7K92';
  refs.roomMeta.innerHTML = `
    <div class="badge">🔒 PRIVATE ROOM</div>
    <div class="badge">${currentMember.avatar} ${currentMember.displayName}</div>
  `;
  renderChat(room.messages, currentMember);
  renderMembers(room.members);
  renderProfile(currentMember, room);
}

function setCurrentTab(tab) {
  appState.activeTab = tab;
  refs.navButtons.forEach(button => {
    button.classList.toggle('active', button.dataset.tab === tab);
  });
  refs.tabPanels.forEach(panel => {
    panel.classList.toggle('active', panel.dataset.panel === tab);
  });
}

function renderChat(messages, currentMember) {
  refs.chatList.innerHTML = '';

  if (!messages || messages.length === 0) {
    refs.chatList.innerHTML = '<div class="empty-state">It\'s quiet in here... someone say something 👀</div>';
    return;
  }

  messages.forEach(message => {
    const bubble = document.createElement('div');
    const self = message.senderId === currentMember.id || message.displayName === currentMember.displayName;
    bubble.className = `message-bubble ${self ? 'self' : ''}`;
    bubble.innerHTML = `
      <div class="avatar-chip">${message.avatar || '✨'}</div>
      <div>
        <div class="message-meta">
          <span class="message-name">${message.displayName}</span>
          <span class="message-time">${new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
        </div>
        <div class="message-text">${message.message}</div>
        <div class="reactions"><span class="reaction">😍</span><span class="reaction">✨</span></div>
      </div>
    `;
    refs.chatList.appendChild(bubble);
  });

  refs.chatList.scrollTop = refs.chatList.scrollHeight;
}

function renderMembers(members) {
  refs.memberList.innerHTML = '';
  if (!members || members.length === 0) {
    refs.memberList.innerHTML = '<div class="empty-state">No members yet — the room is quiet.</div>';
    return;
  }

  members.forEach(member => {
    const item = document.createElement('div');
    item.className = 'member-item';
    item.innerHTML = `
      <div class="member-main">
        <div class="avatar-chip">${member.avatar}</div>
        <div>
          <strong>${member.displayName}</strong>
          <div class="badge-row">
            ${member.badges && member.badges.length ? member.badges.map(badge => `<span class="badge">${badge}</span>`).join('') : '<span class="badge">🏆 Member</span>'}
          </div>
        </div>
      </div>
      <div class="badge">${member.points || 0} pts</div>
    `;
    refs.memberList.appendChild(item);
  });
}

function renderProfile(member, room) {
  refs.profileSummary.innerHTML = `
    <div class="member-item">
      <div class="member-main">
        <div class="avatar-chip" style="width:56px;height:56px;font-size:2rem;">${member.avatar}</div>
        <div>
          <div style="font-size:1.2rem;font-weight:700;">${member.displayName}</div>
          <div style="color:var(--text-soft)">Level 8 • Vibe Champion</div>
        </div>
      </div>
    </div>
    <div class="stat-row"><span>Total Points</span><strong>${member.points || 240}</strong></div>
    <div class="stat-row"><span>Quiz Wins</span><strong>8</strong></div>
    <div class="stat-row"><span>Game Nights</span><strong>12</strong></div>
    <div class="stat-row"><span>Favorite mode</span><strong>Midnight</strong></div>
    <div class="badge-row">
      <span class="badge">🌟 Quiz Master</span>
      <span class="badge">🏆 Vibe Champion</span>
      <span class="badge">🎭 Mystery Master</span>
    </div>
  `;
}

function sendMessage(event) {
  event.preventDefault();
  if (!appState.roomData || !appState.currentMember) {
    return;
  }

  const text = refs.chatInput.value.trim();
  if (!text) {
    return;
  }

  const payload = {
    memberId: appState.currentMember.memberId || appState.currentMember.id,
    message: text
  };

  fetch(`/api/rooms/${appState.roomData.id}/messages`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(async response => {
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || 'Could not send message.');
      }
      return data;
    })
    .then(data => {
      refs.chatInput.value = '';
      const roomMessages = appState.roomData.messages || [];
      roomMessages.push({
        id: data.message.id,
        senderId: payload.memberId,
        displayName: appState.currentMember.displayName,
        avatar: appState.currentMember.avatar,
        message: text,
        timestamp: new Date().toISOString()
      });
      appState.roomData.messages = roomMessages;
      renderChat(roomMessages, appState.currentMember);
    })
    .catch(() => {
      const roomMessages = appState.roomData.messages || [];
      roomMessages.push({
        id: `local-${Date.now()}`,
        senderId: payload.memberId,
        displayName: appState.currentMember.displayName,
        avatar: appState.currentMember.avatar,
        message: text,
        timestamp: new Date().toISOString()
      });
      appState.roomData.messages = roomMessages;
      renderChat(roomMessages, appState.currentMember);
      refs.chatInput.value = '';
    });
}

refs.avatarOptions.forEach(option => {
  option.addEventListener('click', () => setAvatarSelection(option.dataset.avatar));
});

refs.createForm.addEventListener('submit', handleCreateRoom);
refs.joinForm.addEventListener('submit', handleJoinRoom);
refs.navButtons.forEach(button => {
  button.addEventListener('click', () => setCurrentTab(button.dataset.tab));
});
refs.chatForm.addEventListener('submit', sendMessage);

setAvatarSelection('🌙');
setView('welcome');
setCurrentTab('chat');
setNotification('');
