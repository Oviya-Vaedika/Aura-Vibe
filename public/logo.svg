const appState = {
  currentView: 'welcome',
  currentRoom: null,
  currentMember: null,
  activeTab: 'chat',
  roomData: null,
  pendingAvatar: '✨',
  notification: ''
};

const avatarCatalog = ['🌙', '🦊', '🐻', '🚀', '🧚', '😹', '🍓', '🌸', '🍕', '🧁'];

const refs = {
  welcomeView: document.getElementById('welcomeView'),
  roomView: document.getElementById('roomView'),
  createForm: document.getElementById('createForm'),
  joinForm: document.getElementById('joinForm'),
  avatarOptions: document.querySelectorAll('.avatar-option'),
  roomName: document.getElementById('roomName'),
  roomCode: document.getElementById('roomCode'),
  roomTitle: document.getElementById('roomTitle'),
  roomCodeBlock: document.getElementById('roomCodeBlock'),
  roomMeta: document.getElementById('roomMeta'),
  navButtons: document.querySelectorAll('.nav-item'),
  tabPanels: document.querySelectorAll('.tab-panel'),
  formNotice: document.getElementById('formNotice'),
  chatList: document.getElementById('chatList'),
  chatInput: document.getElementById('chatInput'),
  chatForm: document.getElementById('chatForm'),
  memberList: document.getElementById('memberList'),
  profileSummary: document.getElementById('profileSummary')
};

function setView(view) {
  appState.currentView = view;
  refs.welcomeView.classList.toggle('hidden', view !== 'welcome');
  refs.roomView.classList.toggle('hidden', view !== 'room');
}

function setNotification(message) {
  refs.formNotice.textContent = message || '';
  refs.formNotice.style.display = message ? 'block' : 'none';
}

function setAvatarSelection(value) {
  appState.pendingAvatar = value;
  refs.avatarOptions.forEach(option => {
    option.classList.toggle('selected', option.dataset.avatar === value);
  });
}

function handleCreateRoom(event) {
  event.preventDefault();
  const formData = new FormData(refs.createForm);
  const payload = {
    roomName: formData.get('roomName'),
    displayName: formData.get('displayName'),
    avatar: appState.pendingAvatar
  };

  fetch('/api/rooms/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(async response => {
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || 'Could not create room.');
      }
      return data;
    })
    .then(data => {
      appState.currentRoom = data.room.roomName;
      appState.currentMember = {
        displayName: data.room.displayName,
        avatar: data.room.avatar,
        memberId: data.room.memberId
      };
      refs.roomTitle.textContent = data.room.roomName;
      refs.roomCodeBlock.textContent = data.room.roomCode;
      refs.roomMeta.innerHTML = `
        <div class="badge">🛡 Private Room</div>
        <div class="badge">${data.room.avatar} ${data.room.displayName}</div>
      `;
      setView('room');
      loadRoomData(data.room.roomName, data.room.roomCode, data.room.memberId, true);
    })
    .catch(error => {
      setNotification(error.message || 'Looks like the vibe got interrupted. Trying again...');
    });
}

function handleJoinRoom(event) {
  event.preventDefault();
  const payload = {
    roomName: refs.roomName.value,
    roomCode: refs.roomCode.value,
    displayName: document.getElementById('joinDisplayName').value,
    avatar: appState.pendingAvatar
  };

  fetch('/api/rooms/join', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(async response => {
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || 'Could not join room.');
      }
      return data;
    })
    .then(data => {
      appState.currentRoom = data.room.roomName;
      appState.currentMember = {
        displayName: data.room.displayName,
        avatar: data.room.avatar,
        memberId: data.room.memberId
      };
      refs.roomTitle.textContent = data.room.roomName;
      refs.roomCodeBlock.textContent = data.room.roomCode;
      refs.roomMeta.innerHTML = `
        <div class="badge">🔒 Private Room</div>
        <div class="badge">${data.room.avatar} ${data.room.displayName}</div>
      `;
      setView('room');
      setNotification('');
      loadRoomData(data.room.roomName, data.room.roomCode, data.room.memberId, false);
    })
    .catch(error => {
      setNotification(error.message || 'Looks like the vibe got interrupted. Trying again...');
    });
}

function loadRoomData(roomName, roomCode, memberId, created) {
  const roomLookup = roomName;
  fetch(`/api/rooms/${findRoomIdByName(roomName, roomCode)}?memberId=${memberId}`)
    .then(async response => {
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || 'Private room access denied.');
      }
      return data;
    })
    .then(data => {
      appState.roomData = data.room;
      renderRoom(data.room, data.member);
      setCurrentTab('chat');
    })
    .catch(error => {
      console.warn(error);
      fallbackRoomData(roomName, memberId, created);
    });
}

function findRoomIdByName(roomName, roomCode) {
  return 'demo-room';
}

